name: 仓库保活

on:
  schedule:
    # 每月 1 号运行一次，避免仓库未更新导致 Actions 被禁用
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # 通知渠道配置（可选，配置后自动启用对应渠道，可同时启用多个）
    env:
      WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
      DINGTALK_BOT_KEY: ${{ secrets.DINGTALK_BOT_KEY }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      FEISHU_BOT_KEY: ${{ secrets.FEISHU_BOT_KEY }}
      YUNHU_BOT_KEY: ${{ secrets.YUNHU_BOT_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_GROUP: ${{ secrets.BARK_GROUP }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      MAIL_HOST: ${{ secrets.MAIL_HOST }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          cat > .github/KEEPALIVE.md << EOF
          # Repository Keepalive

          This file is automatically updated to keep the repository active.

          **Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow Run:** #${{ github.run_number }}
          **Trigger:** ${{ github.event_name }}

          ---
          *Auto-generated by [仓库保活 workflow](.github/workflows/仓库保活.yml)*
          EOF

      - name: 提交并推送
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .github/KEEPALIVE.md

          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "chore: keepalive at $(date -u +'%Y-%m-%d')"
            git push
            echo "保活提交成功"
          fi

      - name: 发送保活成功通知
        run: node keepalive-notify.js